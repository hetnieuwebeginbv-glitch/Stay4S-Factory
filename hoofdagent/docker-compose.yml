
  linkerhand:
    build: .
    command: ["python3", "hoofdagent/linkerhand.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stay4s:${POSTGRES_PASSWORD}@postgres:5432/stay4s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rechterhand:
    build: .
    command: ["python3", "hoofdagent/rechterhand.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stay4s:${POSTGRES_PASSWORD}@postgres:5432/stay4s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
